name: Test Bestin connection recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run connection recovery regression tests
        run: python -B -m unittest tests/test_bestin_recovery.py -v
      - name: Compile changed Python sources
        run: >-
          python -B -m py_compile
          custom_components/bestin/__init__.py
          custom_components/bestin/hub.py
          custom_components/bestin/controller.py
          tests/test_bestin_recovery.py
